<script>
        // 💡 중요: 기존의 mock 데이터(가짜 데이터)를 삭제하고 data.js에서만 가져오도록 수정했습니다!
        let allProjectData = {};

        function copyEmail(event) { event.preventDefault(); navigator.clipboard.writeText("sennxe@gmail.com").then(() => { alert("이메일 주소가 복사되었습니다: sennxe@gmail.com"); }); }
        
        const topBtn = document.getElementById("scrollTopBtn");
        window.addEventListener('scroll', () => { if (window.scrollY > 300) { topBtn.classList.add("visible"); } else { topBtn.classList.remove("visible"); } });
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        const cursorDot = document.getElementById('cursor-dot');
        window.addEventListener('mousemove', (e) => { cursorDot.style.left = e.clientX + 'px'; cursorDot.style.top = e.clientY + 'px'; });
        document.querySelectorAll('.interactable, a, button, .tools-marquee-container').forEach((el) => {
            el.addEventListener('mouseenter', () => cursorDot.classList.add('hovered'));
            el.addEventListener('mouseleave', () => cursorDot.classList.remove('hovered'));
        });
        function addCursorHover(element) {
            element.addEventListener('mouseenter', () => cursorDot.classList.add('hovered'));
            element.addEventListener('mouseleave', () => cursorDot.classList.remove('hovered'));
        }

        function toggleMobileMenu(forceClose = false) {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (forceClose || sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.classList.remove('open');
            } else {
                sidebar.classList.add('open');
                overlay.classList.add('open');
            }
        }

        function renderCategory(categoryData, categoryId) {
            const gridContainer = document.getElementById(`${categoryId}-grid-container`);
            const submenuContainer = document.getElementById(`${categoryId}-submenu`);
            const homeGridContainer = document.getElementById(`home-${categoryId}-grid`);
            
            gridContainer.innerHTML = ''; submenuContainer.innerHTML = ''; homeGridContainer.innerHTML = '';
            
            if (!categoryData) return;
            const keys = Object.keys(categoryData);
            const total = keys.length;
            
            let count = 0;
            keys.forEach(key => {
                const data = categoryData[key];
                const cleanTitle = data.title;
                const mainImage = data.images[0]; 

                const btn = document.createElement('button');
                btn.className = 'submenu-link interactable';
                btn.id = 'submenu-btn-' + key;
                btn.innerText = cleanTitle;
                btn.onclick = (e) => { e.stopPropagation(); openProject(key, categoryId, btn); };
                addCursorHover(btn);
                submenuContainer.appendChild(btn);
                
                const createArticle = () => {
                    const article = document.createElement('article');
                    article.className = 'grid-item interactable';
                    article.onclick = () => openProject(key, categoryId, btn);
                    addCursorHover(article);
                    article.innerHTML = `<div class="grid-img"><img src="${mainImage}" alt="${cleanTitle}"></div><h3 class="grid-title">${cleanTitle}</h3>`;
                    return article;
                };

                gridContainer.appendChild(createArticle());

                if (count >= total - 6) {
                    homeGridContainer.appendChild(createArticle());
                }
                count++;
            });
        }

        function loadLocalProjects() {
            // 💡 data.js 파일에 있는 진짜 변수들을 사용합니다.
            if (typeof motorSportsData !== 'undefined') {
                renderCategory(motorSportsData, 'motorsports');
                Object.assign(allProjectData, motorSportsData);
            }
            if (typeof portfolioData !== 'undefined') {
                renderCategory(portfolioData, 'portfolio');
                Object.assign(allProjectData, portfolioData);
            }
            initObserver();
        }

        function toggleAccordion(categoryId) {
            const accordion = document.getElementById(`${categoryId}-accordion`);
            const isOpen = accordion.classList.contains('open');
            document.querySelectorAll('.nav-accordion').forEach(acc => acc.classList.remove('open'));
            if(!isOpen) { accordion.classList.add('open'); }
            const btn = document.getElementById(`${categoryId}-tab-btn`);
            switchTab(categoryId, btn, true);
        }

        function extractYouTubeID(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = src;
            lightbox.classList.add('active');
            history.pushState({ view: 'lightbox' }, '', '#lightbox');
        }

        function closeLightbox(e) {
            if(e) e.stopPropagation();
            const lightbox = document.getElementById('lightbox');
            if(lightbox.classList.contains('active')) { history.back(); }
        }

        function openProject(projectId, categoryId, clickedSubmenuBtn, isHistoryBack = false) {
            const container = document.getElementById('project-image-container');
            const currentData = allProjectData[projectId]; 
            container.innerHTML = ''; 
            
            if (currentData.youtube) {
                const ytId = extractYouTubeID(currentData.youtube);
                if (ytId) {
                    const iframeWrapper = document.createElement('div');
                    iframeWrapper.className = 'youtube-wrapper interactable';
                    const iframe = document.createElement('iframe');
                    iframe.src = `https://www.youtube.com/embed/${ytId}`;
                    iframe.frameBorder = "0";
                    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
                    iframe.allowFullscreen = true;
                    iframeWrapper.appendChild(iframe);
                    addCursorHover(iframeWrapper);
                    container.appendChild(iframeWrapper);
                }
            }

            currentData.images.forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                img.classList.add('interactable');
                img.onclick = () => openLightbox(src);
                addCursorHover(img);
                container.appendChild(img);
            });

            document.querySelectorAll('.view-section').forEach(section => section.classList.remove('active'));
            document.getElementById('view-project').classList.add('active');
            document.getElementById('main-page-title').innerText = currentData.title;
            const backBtn = document.getElementById('back-btn');
            backBtn.style.display = 'inline-flex';
            backBtn.innerText = `— Back to ${categoryId === 'motorsports' ? 'Motor Sports' : 'Portfolio'}`;
            backBtn.onclick = () => { switchTab(categoryId, document.getElementById(`${categoryId}-tab-btn`)); };

            document.querySelectorAll('.sidebar-link, .submenu-link').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`${categoryId}-tab-btn`).classList.add('active'); 
            document.querySelectorAll('.nav-accordion').forEach(acc => acc.classList.remove('open'));
            document.getElementById(`${categoryId}-accordion`).classList.add('open');
            if(clickedSubmenuBtn) clickedSubmenuBtn.classList.add('active');
            if (window.innerWidth <= 768) { toggleMobileMenu(true); }
            if(!isHistoryBack) { history.pushState({ view: 'project', id: projectId, cat: categoryId }, '', '#' + projectId); }
            scrollToTop();
        }

        function goBackToHome() { switchTab('home', null); }

        function switchTab(tabId, clickedBtn, skipAccordionState = false, isHistoryBack = false) {
            document.querySelectorAll('.sidebar-link, .submenu-link').forEach(btn => btn.classList.remove('active'));
            if(clickedBtn) clickedBtn.classList.add('active');
            if(!skipAccordionState) {
                document.querySelectorAll('.nav-accordion').forEach(acc => acc.classList.remove('open'));
                if (tabId === 'motorsports' || tabId === 'portfolio') { document.getElementById(`${tabId}-accordion`).classList.add('open'); }
            }
            document.querySelectorAll('.view-section').forEach(section => section.classList.remove('active'));
            document.getElementById('view-' + tabId).classList.add('active');
            
            let titleText = 'Home';
            if (tabId === 'motorsports') titleText = 'Motor Sports';
            if (tabId === 'portfolio') titleText = 'Portfolio';
            if (tabId === 'cv') titleText = 'CV';
            document.getElementById('main-page-title').innerText = titleText;
            
            const backBtn = document.getElementById('back-btn');
            if(tabId === 'home') { backBtn.style.display = 'none'; } 
            else if (tabId !== 'cv') { backBtn.style.display = 'inline-flex'; backBtn.innerText = '— Back to Home'; backBtn.onclick = goBackToHome; } 
            else { backBtn.style.display = 'none'; }
            
            if(tabId === 'home' || tabId === 'motorsports' || tabId === 'portfolio') {
                const items = document.querySelectorAll('.grid-item');
                items.forEach(item => item.classList.remove('visible'));
                setTimeout(initObserver, 50);
            }
            
            if(!isHistoryBack) { 
                if (tabId === 'home') { history.pushState({ view: 'home' }, '', window.location.pathname); }
                else { history.pushState({ view: tabId }, '', '#' + tabId); }
            }
            if (window.innerWidth <= 768) { toggleMobileMenu(true); }
            scrollToTop();
        }

        function goHome(event) { event.preventDefault(); switchTab('home', null); if (window.innerWidth <= 768) { toggleMobileMenu(true); } }

        let observer;
        function initObserver() {
            if(observer) observer.disconnect();
            const options = { root: null, rootMargin: '0px 0px -30px 0px', threshold: 0.1 };
            observer = new IntersectionObserver((entries) => {
                let delay = 0;
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        setTimeout(() => entry.target.classList.add('visible'), delay);
                        delay += 100;
                        observer.unobserve(entry.target);
                    }
                });
            }, options);
            document.querySelectorAll('.grid-item').forEach(item => observer.observe(item));
        }

        window.addEventListener('popstate', (event) => {
            const state = event.state;
            const lightbox = document.getElementById('lightbox');
            if (lightbox.classList.contains('active')) { lightbox.classList.remove('active'); }
            if (state) {
                if (state.view === 'project') {
                    const btn = document.getElementById('submenu-btn-' + state.id);
                    openProject(state.id, state.cat, btn, true);
                } else if (state.view === 'home') { switchTab('home', null, false, true); } 
                else { const btn = document.getElementById(state.view + '-tab-btn'); switchTab(state.view, btn, false, true); }
            } else { switchTab('home', null, false, true); }
        });

        document.addEventListener("DOMContentLoaded", () => {
            loadLocalProjects(); 
            const hash = window.location.hash.replace('#', '');
            if (['cv', 'motorsports', 'portfolio'].includes(hash)) {
                switchTab(hash, document.getElementById(`${hash}-tab-btn`), false, true);
                history.replaceState({ view: hash }, '', '#' + hash);
            } else if (hash && allProjectData[hash]) {
                const cat = (typeof motorSportsData !== 'undefined' && motorSportsData[hash]) ? 'motorsports' : 'portfolio';
                openProject(hash, cat, document.getElementById('submenu-btn-' + hash), true);
                history.replaceState({ view: 'project', id: hash, cat: cat }, '', '#' + hash);
            } else {
                switchTab('home', null, false, true);
                history.replaceState({ view: 'home' }, '', window.location.pathname);
            }
        });
    </script>
